name: Validate Docs

on:
  pull_request:
    paths: ['docs/**', 'docs.json']
  push:
    branches: [main]
    paths: ['docs/**', 'docs.json']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install Mintlify CLI
        run: npm install -g mint
      - name: Validate docs
        run: mint validate